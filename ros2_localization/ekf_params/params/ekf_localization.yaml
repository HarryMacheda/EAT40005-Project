ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link

    # Fuse odometry
    odom0: /odom
    odom0_config: [true,  true, false,
                   false, false, true,
                   false, false, false,
                   false, false, true]
    odom0_queue_size: 10

    # Fuse IMU
    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true]
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

